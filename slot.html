<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#180b3d">
<title>にゃんこスロット DX</title>
<style>
:root{--pink:#ff4fa3;--cyan:#42f5ff;--gold:#ffe36e;--purple:#7b42ff;--ink:#1b1040}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:58px 14px 22px;display:grid;place-items:center;font-family:"Yu Gothic",Meiryo,sans-serif;color:white;background:radial-gradient(circle at 50% 10%,#5732a5 0,#21104e 42%,#09051c 100%);overflow-x:hidden}
body:before,body:after{content:"✦　✧　★　✦　✧　★　✦";position:fixed;left:-10%;width:120%;color:#fff7a8;opacity:.18;font-size:clamp(24px,5vw,54px);letter-spacing:18px;pointer-events:none;animation:drift 18s linear infinite;white-space:nowrap}
body:before{top:8%}body:after{bottom:8%;animation-direction:reverse}
@keyframes drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
.game{width:min(100%,520px);position:relative;padding:24px 20px 22px;border:3px solid #fff;border-radius:30px;text-align:center;background:linear-gradient(145deg,rgba(62,25,124,.98),rgba(19,9,53,.98));box-shadow:0 0 0 5px #ff4fa3,0 0 28px #ff4fa3,0 0 70px #42f5ff66,inset 0 0 30px #a95cff55}
.game:before{content:"";position:absolute;inset:9px;border:1px solid #ffe36e88;border-radius:22px;pointer-events:none}
h1{margin:0;font-size:clamp(27px,7vw,38px);font-weight:1000;letter-spacing:2px;color:#fff;text-shadow:0 3px 0 #b52c9d,0 0 12px #ff4fa3,0 0 24px #ff4fa3}
.subtitle{margin:7px 0 18px;color:#bffaff;font-weight:bold;letter-spacing:1px;text-shadow:0 0 8px #42f5ff}
.topbar{display:flex;gap:10px;margin:16px 0}
.stat{flex:1;padding:10px 7px;border:2px solid #ffe36e;border-radius:15px;background:linear-gradient(135deg,#43227c,#21104e);box-shadow:0 0 12px #ffe36e66;font-weight:900;font-size:13px;color:#ffeaa0}
.stat span{display:block;margin-top:3px;font-size:clamp(20px,5vw,26px);color:#fff;text-shadow:0 0 10px #ffe36e}
.machine{padding:18px 12px 16px;border:3px solid #ffe36e;border-radius:23px;background:linear-gradient(180deg,#ff70b5,#7b2fbc 42%,#32145f);box-shadow:inset 0 0 18px #fff8,0 0 18px #ffe36e77}
.machine-label{margin:0 0 12px;font-size:13px;letter-spacing:3px;font-weight:1000;color:#fff6a8;text-shadow:0 0 8px #ffef6e}
.reels-container{display:flex;justify-content:center;gap:clamp(8px,3vw,16px);margin-bottom:14px}
.reel-col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.reel-window{width:clamp(76px,22vw,104px);height:clamp(90px,25vw,116px);overflow:hidden;position:relative;background:linear-gradient(180deg,#fff,#fff4d8);border:4px solid #ffe36e;border-radius:16px;box-shadow:0 0 0 3px #ff4fa3,0 0 17px #fff,inset 0 5px 9px #0002}
.symbol-el{width:100%;height:100%;position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;font-size:clamp(43px,12vw,60px);user-select:none;filter:drop-shadow(0 4px 2px #0002)}
/* 肉球型ストップボタン */
.stop-btn{position:relative;width:72px;height:68px;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 5px 0 #a51d72) drop-shadow(0 0 8px #ff80c7);touch-action:manipulation}
.paw{position:absolute;inset:0}
.paw i{position:absolute;display:block;background:linear-gradient(145deg,#ffb1df,#ff3b9e 65%,#d91c80);border:2px solid #fff2;box-shadow:inset 0 3px 5px #fff8}
.paw .toe{width:19px;height:23px;border-radius:50%;top:5px}
.paw .toe:nth-child(1){left:8px;transform:rotate(-28deg)}.paw .toe:nth-child(2){left:26px;top:0}.paw .toe:nth-child(3){right:8px;transform:rotate(28deg)}
.paw .pad{width:43px;height:35px;left:14px;bottom:5px;border-radius:48% 48% 42% 42%;transform:rotate(0deg)}
.stop-btn:active:not(:disabled){transform:translateY(4px);filter:drop-shadow(0 1px 0 #a51d72)}
.stop-btn:disabled{opacity:.38;filter:grayscale(1);cursor:not-allowed}
.message{min-height:52px;display:grid;place-items:center;margin:14px 0;padding:9px;border:2px solid #42f5ff;border-radius:14px;background:#130b39;color:#fff;font-size:clamp(14px,3.8vw,17px);font-weight:1000;text-shadow:0 0 8px #42f5ff;box-shadow:0 0 12px #42f5ff66}
.message.win{border-color:#ffe36e;background:linear-gradient(90deg,#7621a8,#c52c91,#7621a8);color:#fff6a5;font-size:19px;animation:winPulse .5s alternate infinite}
@keyframes winPulse{to{box-shadow:0 0 25px #ffe36e;transform:scale(1.02)}}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
select,button{font:inherit;font-weight:900;border-radius:13px}
select{padding:12px 10px;background:#fff;color:#4c2678;border:2px solid #ffe36e;outline:none}
#spin{padding:13px 25px;color:#4a155e;font-size:18px;border:2px solid white;background:linear-gradient(180deg,#fff38a,#ffb52e);box-shadow:0 5px 0 #b75a16,0 0 16px #ffe36e;cursor:pointer;text-shadow:0 1px #fff}
#spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b75a16}
#spin:disabled{opacity:.5;cursor:not-allowed}
.payouts{margin:16px 0 0;padding:12px 10px;border:1px solid #ff9bdb;border-radius:15px;background:#170d3eaa;text-align:left}
.payouts h2{margin:0 0 8px;text-align:center;font-size:14px;color:#ffe88c;letter-spacing:2px}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pay-item{padding:7px 3px;border-radius:10px;background:linear-gradient(135deg,#51277e,#29134f);text-align:center;font-size:13px;font-weight:bold;color:#fff}
.pay-item b{display:block;margin-top:3px;color:#ffe36e;font-size:15px}
.note{margin:10px 0 0;color:#cbbcf5;font-size:11px;text-align:center}
.jackpot{position:absolute;top:-18px;left:50%;transform:translateX(-50%);padding:5px 18px;border-radius:30px;border:2px solid #fff;background:linear-gradient(90deg,#ff4fa3,#ffb52e);font-size:12px;font-weight:1000;letter-spacing:2px;box-shadow:0 0 15px #ff4fa3}
.confetti{position:fixed;top:-20px;z-index:10;pointer-events:none;font-size:22px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
#backBtn{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:20;width:38px;height:38px;border-radius:50%;border:2px solid #ffe36e;background:#21104e;color:#fff;font:900 20px/1 system-ui,sans-serif;box-shadow:0 0 10px #ff4fa3;cursor:pointer}
#sndBtn{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:20;width:38px;height:38px;border-radius:50%;border:2px solid #ffe36e;background:#21104e;color:#fff;font-size:17px;cursor:pointer}
.limit{margin:-6px 0 12px;font-size:12px;font-weight:900;color:#ffeaa0}
@media(max-width:380px){.game{padding:22px 12px 16px}.stop-btn{transform:scale(.9)}.reels-container{gap:7px}}
</style>
</head>
<body>
<!-- 組員作のミニゲーム。にゃんカロの中で開くと、アプリのコインをかける（1日のもうけ上限あり） -->
<button id="backBtn" aria-label="にゃんカロにもどる">×</button>
<button id="sndBtn" aria-label="BGMのオン・オフ">🔊</button>
<main class="game">
 <div class="jackpot">★ NYANKO SLOT DX ★</div>
 <h1>🐾 にゃんこスロット</h1>
 <p class="subtitle">LUCKY CHANCE!!　目押しで大当たりを狙え！</p>
 <div class="topbar">
  <div class="stat">💰 コイン<span id="coins">1000</span></div>
  <div class="stat"><span id="earnedLabel" style="display:inline;font-size:inherit;text-shadow:none;color:inherit;margin:0">🏆 獲得合計</span><span id="earned">0</span></div>
 </div>
 <p class="limit" id="limitNote"></p>
 <section class="machine">
  <p class="machine-label">✦ ✦ SUPER CAT REELS ✦ ✦</p>
  <div class="reels-container">
   <div class="reel-col"><div class="reel-window" id="reel0"><div class="symbol-el top"></div><div class="symbol-el curr"></div></div><button class="stop-btn" id="stop0" aria-label="左リールを止める" disabled><span class="paw"><i class="toe"></i><i class="toe"></i><i class="toe"></i><i class="pad"></i></span></button></div>
   <div class="reel-col"><div class="reel-window" id="reel1"><div class="symbol-el top"></div><div class="symbol-el curr"></div></div><button class="stop-btn" id="stop1" aria-label="中央リールを止める" disabled><span class="paw"><i class="toe"></i><i class="toe"></i><i class="toe"></i><i class="pad"></i></span></button></div>
   <div class="reel-col"><div class="reel-window" id="reel2"><div class="symbol-el top"></div><div class="symbol-el curr"></div></div><button class="stop-btn" id="stop2" aria-label="右リールを止める" disabled><span class="paw"><i class="toe"></i><i class="toe"></i><i class="toe"></i><i class="pad"></i></span></button></div>
  </div>
  <div class="message" id="message">スピンして肉球ボタンでストップ！</div>
  <div class="controls"><select id="betAmount" aria-label="賭け金"><option value="10">10コイン BET</option><option value="20">20コイン BET</option><option value="30" selected>30コイン BET</option></select><button id="spin">🎰 SPIN!!</button></div>
 </section>
 <section class="payouts"><h2>🐱 絵柄別 PAYOUT</h2><div class="pay-grid">
  <div class="pay-item">🍎 りんご<b>×2</b></div><div class="pay-item">🥗 サラダ<b>×3</b></div><div class="pay-item">🐟 おさかな<b>×4</b></div>
  <div class="pay-item">🏋️ ダンベル<b>×5</b></div><div class="pay-item">🥊 グローブ<b>×8</b></div><div class="pay-item">🐈 にゃんこ<b>×10</b></div>
 </div><p class="note">同じ絵柄が3つ揃うと BET × 絵柄倍率 のコインを獲得！</p></section>
</main>
<script>
const symbols=["🍎","🥗","🐟","🏋️","🥊","🐈"];
const multipliers={"🍎":2,"🥗":3,"🐟":4,"🏋️":5,"🥊":8,"🐈":10};
// にゃんカロとのつなぎ（同じサイトの中で iframe として開かれたときだけ使える）
const APP=(()=>{try{return window.parent!==window&&window.parent.nyankaloMini?window.parent.nyankaloMini:null}catch(e){return null}})();
let coins=1000,earned=0,busy=false,netMax=100;
if(APP){const i=APP.slotInfo();coins=i.coins;earned=i.net;netMax=i.max}
const coinsEl=document.getElementById('coins'),earnedEl=document.getElementById('earned'),messageEl=document.getElementById('message'),betSelect=document.getElementById('betAmount'),spinBtn=document.getElementById('spin');
let sfxContext=null;
function playTone(frequency,duration,type='sine',volume=.12,endFrequency=null,delay=0){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!sfxContext)sfxContext=new AC();if(sfxContext.state==='suspended')sfxContext.resume();const t=sfxContext.currentTime+delay,o=sfxContext.createOscillator(),g=sfxContext.createGain();o.type=type;o.frequency.setValueAtTime(frequency,t);if(endFrequency!==null)o.frequency.exponentialRampToValueAtTime(endFrequency,t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(sfxContext.destination);o.start(t);o.stop(t+duration+.03)}catch(e){}}
function playSpinSound(){playTone(150,.35,'sawtooth',.05,430);playTone(250,.25,'triangle',.04,650,.12)}
function playStopSound(){playTone(680,.12,'square',.07,300)}
function playWinSound(){[[523,0],[659,.13],[784,.26],[1047,.42],[1318,.58]].forEach(([f,d])=>playTone(f,.3,'triangle',.12,null,d))}
function updateUI(){coinsEl.textContent=coins;earnedEl.textContent=APP?(earned>0?'+':'')+earned:earned;spinBtn.disabled=busy;betSelect.disabled=busy;
 if(APP){document.getElementById('earnedLabel').textContent='📈 今日のもうけ';document.getElementById('limitNote').textContent=earned>=netMax?`今日のもうけ上限（${netMax}枚）に達しました。当たってもコインは増えません`:`アプリのコインをかけます。1日のもうけ上限 ${netMax}枚（あと${netMax-Math.max(0,earned)}枚）`}}
updateUI();
function randomSymbol(){return symbols[Math.floor(Math.random()*symbols.length)]}
function shuffledSymbols(){const order=[...symbols];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}return order}
class Reel{
 constructor(id,buttonId){this.el=document.getElementById(id);this.stopBtn=document.getElementById(buttonId);this.topEl=this.el.querySelector('.top');this.currEl=this.el.querySelector('.curr');this.y=0;this.step=this.el.clientHeight;this.speed=this.step/13;this.spinning=false;this.stopping=false;this.onStopped=null;this.order=shuffledSymbols();this.orderIndex=0;this.currEl.textContent=randomSymbol();this.topEl.textContent=randomSymbol();this.render();this.stopBtn.addEventListener('click',()=>{if(this.spinning&&!this.stopping){this.stopping=true;this.stopBtn.disabled=true;playStopSound()}})}
 start(onStopped){this.onStopped=onStopped;this.spinning=true;this.stopping=false;this.stopBtn.disabled=false;this.y=0;this.order=shuffledSymbols();this.orderIndex=0;this.topEl.textContent=this.order[this.orderIndex];this.animate()}
 animate(){if(!this.spinning)return;this.y+=this.speed;if(this.y>=this.step){this.y-=this.step;this.currEl.textContent=this.topEl.textContent;if(this.stopping){this.y=0;this.spinning=false;this.render();this.stopBtn.disabled=true;this.onStopped(this.currEl.textContent);return}else{this.orderIndex=(this.orderIndex+1)%this.order.length;this.topEl.textContent=this.order[this.orderIndex]}}this.render();requestAnimationFrame(()=>this.animate())}
 render(){this.currEl.style.transform=`translateY(${this.y}px)`;this.topEl.style.transform=`translateY(${this.y-this.step}px)`}
}
const reels=[new Reel('reel0','stop0'),new Reel('reel1','stop1'),new Reel('reel2','stop2')];
function burst(){const icons=['✨','⭐','💖','🐾','🎉'];for(let i=0;i<42;i++){const el=document.createElement('span');el.className='confetti';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=Math.random()*100+'vw';el.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}}
spinBtn.addEventListener('click',()=>{if(busy)return;const bet=Number(betSelect.value);if(coins<bet){messageEl.textContent='コインが足りません！';return}
 if(APP){const r=APP.slotBet(bet);if(!r.ok){coins=r.coins;updateUI();messageEl.textContent='コインが足りません！';return}coins=r.coins;earned=r.net}else coins-=bet;
 busy=true;updateUI();messageEl.className='message';messageEl.textContent='🎰 回転中！タイミングを合わせて肉球をタップ！';playSpinSound();const results=[];let stopped=0;reels.forEach((reel,index)=>reel.start(symbol=>{results[index]=symbol;stopped++;if(stopped===3)checkResult(results,bet)}))});
function checkResult(result,bet){if(result[0]===result[1]&&result[1]===result[2]){const reward=bet*multipliers[result[0]];let got=reward,capTxt='';
 if(APP){const r=APP.slotWin(reward);got=r.given;coins=r.coins;earned=r.net;if(r.capped)capTxt=`（今日の上限で +${got}）`}else{coins+=reward;earned+=reward}
 messageEl.textContent=`🎉 大当たり！ ${result[0]} ×${multipliers[result[0]]}　+${reward}コイン！${capTxt}`;messageEl.classList.add('win');playWinSound();burst()}else{messageEl.textContent='🐾 おしい！ もう一度チャレンジ！'}busy=false;updateUI()}
</script>
<!-- BGMはHTML内に内蔵。ページ表示中はループ再生 -->
<audio id="backgroundMusic" loop preload="auto" playsinline><source src="slot-bgm.mp3?v=9.6" type="audio/mpeg"></audio>
<script>
(()=>{const bgm=document.getElementById('backgroundMusic');bgm.volume=.5;let on=!(APP&&!APP.info().sound);const sb=document.getElementById('sndBtn');sb.textContent=on?'🔊':'🔇';
sb.addEventListener('click',e=>{e.stopPropagation();on=!on;sb.textContent=on?'🔊':'🔇';if(on)play();else bgm.pause()});
document.getElementById('backBtn').addEventListener('click',()=>{bgm.pause();if(APP)APP.close();else history.back()});
const play=()=>{if(on&&bgm.paused){const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}};window.addEventListener('load',play);['pointerdown','touchstart','keydown'].forEach(e=>window.addEventListener(e,play,{once:true,passive:true}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)play()})})();
</script>
</body></html>

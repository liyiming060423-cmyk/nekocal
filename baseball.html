<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D46">
<title>にゃんこバッティング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--ink:#4A2A1A;--orange:#F0943F;--red:#E0573F;--cream:#FFF8EC;--font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1E4A2E;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font);color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#stage{position:relative;width:min(100vw,calc(100vh*9/16));width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;max-height:100vh;max-height:100dvh;overflow:hidden;font-size:14px;background:#7EC8F2}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#backBtn{position:absolute;top:.6em;left:.6em;z-index:8;width:2.7em;height:2.7em;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font:900 1.3em/1 var(--font);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0}
#swingBtn{position:absolute;right:4%;bottom:3.2%;z-index:4;width:30%;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#FF8A6B,#E0573F 55%,#B83A26);color:#fff;font:900 1.3em/1 var(--font);letter-spacing:.04em;
  text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 .4em 0 var(--ink);cursor:pointer;touch-action:none;padding:0}
#swingBtn small{display:block;font-size:.55em;margin-top:.35em;opacity:.9;letter-spacing:0}
#swingBtn.on{transform:translateY(.3em);box-shadow:0 .1em 0 var(--ink)}
#swingBtn[hidden]{display:none}
@media (pointer:coarse){#swingBtn small{display:none}}
#padHint{position:absolute;left:4%;bottom:5%;z-index:3;width:56%;padding:.55em .7em;border-radius:1em;background:rgba(255,255,255,.82);border:2px dashed rgba(74,42,26,.55);
  font-weight:900;font-size:.86em;line-height:1.35;text-align:center;pointer-events:none;transition:opacity .4s}
#padHint.fade{opacity:0}
.ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:.6em;padding:3.6em .9em 1.1em;overflow-y:auto;
  background:rgba(30,60,40,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);touch-action:pan-y}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:1.75em;font-weight:900;color:#fff;text-align:center;line-height:1.15;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.ov h1 span{display:block;font-size:.5em;margin-top:.35em;color:#FFE38A}
.card{width:100%;background:var(--cream);border:3px solid var(--ink);border-radius:1.1em;box-shadow:0 4px 0 var(--ink);padding:.7em .85em}
.catcard .ttl{font-weight:900;margin-bottom:.35em}
.st{display:grid;grid-template-columns:5.3em 2.2em 1fr;align-items:center;gap:.4em;font-weight:900;font-size:.9em;margin:.25em 0}
.st .bar{height:.75em;border-radius:1em;background:#E9DCC8;border:2px solid var(--ink);overflow:hidden;position:relative}
.st .bar i{position:absolute;inset:0 auto 0 0;border-radius:1em}
.st .eff{grid-column:3;font-size:.78em;font-weight:700;margin-top:-.2em;opacity:.8}
.dogs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;width:100%}
.dog{display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.45em .25em .55em;background:#fff;border:3px solid var(--ink);border-radius:1em;box-shadow:0 4px 0 var(--ink);
  font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.dog:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dog canvas{width:100%;aspect-ratio:1;display:block;border-radius:.7em;background:linear-gradient(#BFE6FA,#E8F6FF 60%,#8CCB7A 61%)}
.dog b{font-size:1em}
.dog .lv{font-size:.72em;font-weight:900;color:#fff;padding:.1em .6em;border-radius:1em}
.dog .sm{font-size:.68em;font-weight:700;line-height:1.3;text-align:center}
.dog .sm i{font-style:normal;display:inline-block}
.dog .best{font-size:.72em;font-weight:900;color:#B5482B}
.left{font-weight:900;font-size:.88em;text-align:center;color:#fff;text-shadow:0 2px 0 var(--ink)}
.how{font-size:.8em;font-weight:700;line-height:1.5}
.how b{color:#B5482B}
.res .big{font-size:2.1em;font-weight:900;text-align:center;line-height:1.1}
.res .big small{font-size:.45em;display:block}
.res .nb{text-align:center;font-weight:900;color:#D9772B}
.log{display:grid;grid-template-columns:1.6em 1fr auto;gap:.15em .5em;font-size:.82em;font-weight:700;margin:.5em 0 0}
.log .k{font-weight:900;text-align:right}
.coin{font-weight:900;text-align:center;font-size:1.05em;padding:.45em;border-radius:.8em;background:#FFE7A8;border:2px solid var(--ink)}
.btns{display:flex;gap:.6em;width:100%}
.btn{flex:1;border:3px solid var(--ink);background:var(--orange);color:var(--ink);font:900 1em var(--font);border-radius:1em;padding:.7em .4em;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn.white{background:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
</style>
</head>
<body>
<!-- ミニゲーム「にゃんこバッティング」。にゃんカロの中で開くと、自分の猫の能力・毛色・服の色で遊べて、コインがアプリにたまる（1回の上限あり） -->
<div id="stage">
  <canvas id="cv" width="360" height="640" aria-label="バッティングの画面（キャッチャーの後ろから見た球場）"></canvas>
  <button id="backBtn" aria-label="にゃんカロにもどる">×</button>
  <div id="padHint" hidden>画面をドラッグして<br>カーソルを動かす</div>
  <button id="swingBtn" hidden aria-label="スイング">スイング<small>（スペースキー）</small></button>

  <div class="ov" id="titleOv">
    <h1>にゃんこバッティング<span>犬のピッチャーの10球を打ちかえせ！</span></h1>
    <div class="card catcard" id="catCard"></div>
    <div class="dogs" id="dogList"></div>
    <div class="left" id="leftMsg"></div>
    <div class="card how">
      <b>あそびかた</b>　画面のどこでもドラッグすると黄色い<b>カーソル</b>が動く。ボールがカーソルに重なったときに<b>スイング</b>！<br>
      カーソルの真ん中（オレンジ）で打つと遠くへ飛ぶ。ボールの<b>下</b>を打つとフライ、<b>上</b>を打つとゴロ。早く振ると左へ、おそいと右へ。<br>
      ホームラン100・長打50・ヒット30・ファウル5点。合計点でコインがもらえる（最大<span id="maxC">50</span>）。
    </div>
  </div>

  <div class="ov" id="resultOv" hidden>
    <h1>結果</h1>
    <div class="card res" id="resBody"></div>
    <div class="btns"><button class="btn" id="againBtn">もう一回</button><button class="btn white" id="pickBtn">ピッチャーをえらぶ</button></div>
  </div>
</div>
<script>
'use strict';
/* =========================================================
   にゃんこバッティング
   キャッチャーの後ろから見た画面。遠くに犬のピッチャー、手前にストライクゾーン、左に自分の猫（うしろ姿）。
   座標：画面は 360×640。遠近法は「奥行き Z（ゾーン＝1、ピッチャー＝6）」で 画面x = CX + X*F/Z、画面y = CY + Y*F/Z。
   ========================================================= */

// ===== バランス（ここの数字で調整できる） =====
const PITCHES = 10;                                 // 1回の球数
const PTS = { hr: 100, xbh: 50, hit: 30, foul: 5 }; // 点数（ホームラン／長打／ヒット／ファウル）
const COIN_DIV = 8;                                 // コイン = 合計点 × 投手のコイン倍率 ÷ これ（上限はアプリの miniRewardMax）
const eff = v => v / (v + 60);                      // 能力の効き目（0〜1。数値が上がるほどゆるやかに増える）
// 投手（犬）。kmh=ストレートの球速、T=ストレートがとどく時間（秒・ゲーム用にゆっくり）、out=ボール球の割合、brk=変化の大きさ、mix=球種の割合
const DOGS = {
  shiba:   { name: '柴犬',     lv: '初級', lvc: '#3FA35B', kmh: [100, 115], T: 1.15, out: .15, brk: .75, mix: { st: 70, cv: 30 },                 coin: 1.0, num: '1',
             fur: '#D9893B', light: '#FFF3E0', dark: '#6B3E1C', uni: '#2F8F4E' },
  bulldog: { name: 'ブルドッグ', lv: '中級', lvc: '#E0952B', kmh: [122, 138], T: .95,  out: .2,  brk: 1.0, mix: { st: 50, cv: 20, sl: 30 },          coin: 1.2, num: '22',
             fur: '#E6CFA8', light: '#FFF9EF', dark: '#5E4A36', uni: '#2B3F7A' },
  husky:   { name: 'ハスキー',   lv: '上級', lvc: '#C2335E', kmh: [142, 158], T: .78,  out: .25, brk: 1.2, mix: { st: 40, cv: 15, sl: 25, fk: 20 }, coin: 1.5, num: '18',
             fur: '#7D8794', light: '#FFFFFF', dark: '#2E3440', uni: '#6E3AA8' }
};
// 球種。spd=ストレートとくらべた速さ、bx/by=変化（右／下）、k=曲がりはじめのおそさ（大きいほど手元で曲がる）
const PTYPE = {
  st: { name: 'ストレート', spd: 1.0,  bx: 0,   by: 0,   k: 2 },
  cv: { name: 'カーブ',     spd: .8,   bx: .14, by: .24, k: 1.7 },
  sl: { name: 'スライダー', spd: .9,   bx: .24, by: .05, k: 2.4 },
  fk: { name: 'フォーク',   spd: .92,  bx: 0,   by: .30, k: 3.6 }
};
const LAG = .07;   // スイングボタンを押してからバットがボールの位置にくるまで（秒）

// ===== アプリとのつなぎ =====
const APP = (() => { try { return window.parent !== window && window.parent.nyankaloMini ? window.parent.nyankaloMini : null; } catch (e) { return null; } })();
const DEF_CAT = { name: 'もち', breed: 'tabby', level: 1, pow: 20, spd: 20, sta: 20, head: null, top: 'tee_orange', hand: 'gloves_brown', shirt: '#F08A3C', gloves: '#7A4A2A' };
let INFO = null, CAT = DEF_CAT;
function loadInfo() {
  try { INFO = APP ? APP.info() : null; } catch (e) { INFO = null; }
  CAT = Object.assign({}, DEF_CAT, (INFO && INFO.cat) || {});
}
loadInfo();
const sndOn = () => !INFO || INFO.sound !== false;
const vibOn = () => (!INFO || INFO.vibrate !== false) && typeof navigator.vibrate === 'function';
const buzz = p => { if (vibOn()) try { navigator.vibrate(p); } catch (e) {} };
function getBest() {
  try { return APP ? (APP.getRec('baseball') || {}) : JSON.parse(localStorage.getItem('nb_best') || '{}'); } catch (e) { return {}; }
}
function setBest(o) {
  try { if (APP) APP.setRec('baseball', o); else localStorage.setItem('nb_best', JSON.stringify(o)); } catch (e) {}
}

// ===== 画面・遠近法 =====
const cv = document.getElementById('cv'), g = cv.getContext('2d'), stage = document.getElementById('stage');
const W = 360, H = 640, F = 300, CX = 180, CY = 200;
const M = .271;                                     // 球場の 1m を奥行きの単位に直す倍率（ピッチャーまで18.44m → Z=6）
const PZ = 6;                                       // ピッチャーの奥行き
const ZCY = .667, ZHW = .225, ZHH = .25, BRW = .038; // ゾーンの中心の高さ・半分の幅・半分の高さ、ボールの半径
const ZL = CX - ZHW * F, ZR = CX + ZHW * F, ZT = CY + (ZCY - ZHH) * F, ZB = CY + (ZCY + ZHH) * F;
const REL = { X: -.03, Y: -.14 };                   // ボールをはなす位置（ピッチャーの手）
const pj = (X, Y, Z) => [CX + X * F / Z, CY + Y * F / Z, F / Z];
const fieldPt = (xm, zm, hm = 0) => pj(xm * M, 1 - hm * M, 1 + zm * M);   // 球場の地面の点（m）
const CATX = 52, CATY = 506, CATS = 1.0;            // 猫の足もとの位置と大きさ

// 能力から決まる値
let CRW, CRH, TW, MAXD;
function calcStats() {
  CRW = (ZR - ZL) * (.16 + .2 * eff(CAT.spd));   // カーソルの半分の幅（すばやさ）
  CRH = CRW * .72;
  TW = .10 + .09 * eff(CAT.sta);                 // タイミングのゆるさ（たいりょく）：ずれてよい秒数
  MAXD = 100 + 70 * eff(CAT.pow);                // 最大飛距離 m（ちから）
}
calcStats();
const fence = dir => 92 + 24 * (1 - Math.min(1, Math.abs(dir) / 45));   // フェンスまでの距離（センター116m・両翼92m）

let dpr = 1;
function resize() {
  dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = stage.clientWidth;
  stage.style.fontSize = (w / 360 * 14) + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(cv.width * H / W);
  makeBg();
}

// 色の明るさ（0〜1）
function lum(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return .5; const n = parseInt(m[1], 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255; }
// 古いスマホ（roundRect がないブラウザ）用
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };

// ===== 乱数 =====
const R = Math.random, rnd = (a, b) => a + R() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function pickMix(mix) { let s = 0; for (const k in mix) s += mix[k]; let r = R() * s; for (const k in mix) { r -= mix[k]; if (r <= 0) return k; } return 'st'; }
function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

// ===== 背景（球場）を1回だけ描いておく =====
let bg = null;
function makeBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d'), s = bg.width / W; c.scale(s, s);
  const rr = seeded(7);
  // 空
  let gr = c.createLinearGradient(0, 0, 0, 200); gr.addColorStop(0, '#6EC1F0'); gr.addColorStop(1, '#D4F0FF');
  c.fillStyle = gr; c.fillRect(0, 0, W, 220);
  c.fillStyle = 'rgba(255,255,255,.9)';
  [[60, 52, 1], [270, 34, .8], [330, 86, .6], [150, 92, .55]].forEach(([x, y, k]) => { c.beginPath(); c.ellipse(x, y, 30 * k, 11 * k, 0, 0, 7); c.ellipse(x + 18 * k, y - 7 * k, 20 * k, 12 * k, 0, 0, 7); c.ellipse(x - 20 * k, y - 3 * k, 16 * k, 9 * k, 0, 0, 7); c.fill(); });
  // 照明塔
  [[22, 112], [338, 112]].forEach(([x, y]) => { c.fillStyle = '#5B6B7A'; c.fillRect(x - 1.5, y, 3, 60); c.fillStyle = '#E8EEF2'; c.fillRect(x - 11, y - 9, 22, 11); c.strokeStyle = '#5B6B7A'; c.lineWidth = 1.5; c.strokeRect(x - 11, y - 9, 22, 11); });
  // スタンド（観客）
  c.fillStyle = '#3F5D78'; c.beginPath(); c.moveTo(0, 150); c.quadraticCurveTo(180, 128, 360, 150); c.lineTo(360, 215); c.lineTo(0, 215); c.fill();
  c.fillStyle = '#2F4A62'; c.fillRect(0, 186, W, 30);
  const cols = ['#FFD166', '#EF476F', '#FFFFFF', '#06D6A0', '#F78C6B', '#A0C4FF', '#FFC6D9'];
  for (let i = 0; i < 520; i++) { const x = rr() * W, y = 142 + rr() * 64; if (y < 150 - Math.sin(x / W * Math.PI) * 18) continue; c.fillStyle = cols[Math.floor(rr() * cols.length)]; c.fillRect(x, y, 2, 2); }
  // 外野フェンス
  const fen = [], top = [];
  for (let a = -60; a <= 60; a += 2) { const d = fence(a), r = a * Math.PI / 180; fen.push(fieldPt(Math.sin(r) * d, Math.cos(r) * d)); top.push(fieldPt(Math.sin(r) * d, Math.cos(r) * d, 4)); }
  // 芝（しま模様）
  c.fillStyle = '#3E9E4A'; c.fillRect(0, 205, W, H);
  for (let z = 0; z < 130; z += 8) { const y1 = fieldPt(0, z)[1], y2 = fieldPt(0, z + 4)[1]; c.fillStyle = '#48AC53'; c.fillRect(0, Math.min(y1, y2), W, Math.abs(y1 - y2)); }
  c.fillStyle = '#1D5E35'; c.beginPath(); fen.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); for (let i = top.length - 1; i >= 0; i--) c.lineTo(top[i][0], top[i][1]); c.fill();
  c.strokeStyle = '#F2C14E'; c.lineWidth = 1.6; c.beginPath(); top.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
  // 内野の土（ファウルラインの間＋円弧）
  const dirt = '#C98B55', dirtD = '#B57846';
  c.fillStyle = dirt; c.beginPath(); c.moveTo(...fieldPt(0, -0.5));
  c.lineTo(...fieldPt(-27.5, 27.5));
  for (let a = -45; a <= 45; a += 3) { const r = a * Math.PI / 180, p = [Math.sin(r) * 29, 18.44 + Math.cos(r) * 29]; c.lineTo(...fieldPt(p[0], p[1])); }
  c.lineTo(...fieldPt(27.5, 27.5)); c.closePath(); c.fill();
  // 内野の芝（ダイヤモンド）
  c.fillStyle = '#45A851'; c.beginPath(); [[0, 2.6], [16.8, 19.4], [0, 36.2], [-16.8, 19.4]].forEach((p, i) => i ? c.lineTo(...fieldPt(...p)) : c.moveTo(...fieldPt(...p))); c.closePath(); c.fill();
  // マウンド
  const mc = fieldPt(0, 18.44), mr = fieldPt(2.7, 18.44)[0] - mc[0], mt = fieldPt(0, 21.1)[1], mb = fieldPt(0, 15.8)[1];
  c.fillStyle = dirtD; c.beginPath(); c.ellipse(mc[0], (mt + mb) / 2, mr, (mb - mt) / 2 + 1, 0, 0, 7); c.fill();
  c.fillStyle = dirt; c.beginPath(); c.ellipse(mc[0], (mt + mb) / 2 - 1, mr * .8, (mb - mt) / 2 - 1, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.fillRect(mc[0] - 5, mc[1] - 1, 10, 2);
  // 2塁ベース
  const b2 = fieldPt(0, 38.8); c.fillStyle = '#fff'; c.fillRect(b2[0] - 3, b2[1] - 1, 6, 2);
  // ファウルライン
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.6;
  [-1, 1].forEach(sg => { c.beginPath(); c.moveTo(...fieldPt(sg * 1, 1)); c.lineTo(...fieldPt(sg * 100, 100)); c.stroke(); });
  // ホームまわりの土（ゾーンにあわせて大きめに描く）
  c.fillStyle = dirt; c.beginPath(); c.ellipse(CX, 540, 250, 120, 0, 0, 7); c.fill();
  c.fillStyle = dirtD; c.fillRect(0, 600, W, 40); c.fillStyle = dirt; c.beginPath(); c.ellipse(CX, 600, 260, 22, 0, 0, 7); c.fill();
  // バッターボックス
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2.5;
  [[-1], [1]].forEach(([sg]) => { c.beginPath(); const x1 = CX + sg * 82, x2 = CX + sg * 200; c.moveTo(x1 + sg * 6, 460); c.lineTo(x2 + sg * 6, 460); c.lineTo(x2 + sg * 40, 590); c.lineTo(x1 + sg * 14, 590); c.closePath(); c.stroke(); });
  // ホームベース
  c.fillStyle = '#fff'; c.strokeStyle = '#9A8F84'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(ZL + 4, 520); c.lineTo(ZR - 4, 520); c.lineTo(ZR - 10, 506); c.lineTo(CX, 494); c.lineTo(ZL + 10, 506); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#E4DCD2'; c.fillRect(ZL + 4, 520, ZR - ZL - 8, 4);
}

// ===== 犬（ピッチャー）を描く =====
// 足もと (x,y)、k=大きさ（1で高さ100）、pose: w=ふりかぶり 0〜1、f=投げたあと 0〜1、ball=手にボールを持つか
function drawDog(c, key, x, y, k, pose) {
  const D = DOGS[key], w = pose.w || 0, f = pose.f || 0, ol = '#3A2418';

// ===== ゲームの状態 =====
let dogKey = 'shiba', state = 'title', P = null, phaseT = 0, relT = 0, swing = null, fl = null, caught = false;
let results = [], score = 0, label = null, particles = [], flash = 0, lastRes = null;
const cur = { x: CX, y: (ZT + ZB) / 2 };
const now = () => performance.now() / 1000;
const HAND0 = { x: 38, y: -150 }, HAND1 = { x: 56, y: -118 };   // 手の位置（かまえ／ふったとき）ローカル
const A0 = -1.84;                                                 // かまえのバットの向き

function makePitch() {

    tx = rnd(-1, 1) * ZHW * .95;
    ty = ZCY + (type === 'fk' || type === 'cv' ? rnd(-.2, 1) : rnd(-1, 1)) * ZHH * .95;
  } else {

    else if (r < .6) { tx = ZHW + o; ty = ZCY + rnd(-1, 1) * ZHH; }
    else if (r < .85) { tx = rnd(-1, 1) * ZHW; ty = ZCY + ZHH + o; }
    else { tx = rnd(-1, 1) * ZHW; ty = ZCY - ZHH - o; }
  }
  const kmhSt = rnd(D.kmh[0], D.kmh[1]);

function ballAt(p, t) {
  const u = Math.min(t, 1), bk = Math.pow(u, p.k);
  const X = REL.X + (p.tx - p.bx - REL.X) * u + p.bx * bk;
  const Y = REL.Y + (p.ty - p.by - REL.Y) * u + p.by * bk;
  // 奥行き：本物の遠近法（終わりに急に大きくなる）と、画面上でまっすぐ同じ速さで動く場合の中間にして見やすくする
  const inv = .5 / (PZ - (PZ - 1) * u) + .5 * (1 / PZ + (1 - 1 / PZ) * u);
  const Z = t <= 1 ? 1 / inv : Math.max(.92, 1 - (t - 1) * 2);

// 当たり判定。e=タイミングのずれ（秒、＋はおそい）、(bx,by)=ボールの画面の位置

  const base = { dir, ang, q, posQ, timQ };
  if (d > .92) return Object.assign(base, { kind: 'foul', tip: true, label: 'ファウル', dist: 0 });
  if (Math.abs(dir) > 45) return Object.assign(base, { kind: 'foul', label: 'ファウル', dist: rnd(30, 70) * q + 15 });
  if (ang < 8) {
    const dist = 22 + 40 * q;
    if (q > .78 && R() < .55) return Object.assign(base, { kind: 'hit', ground: true, label: 'ヒット！', dist: dist + 15 });
    return Object.assign(base, { kind: 'out', ground: true, label: 'ゴロ', dist });
  }
  if (ang > 58) return Object.assign(base, { kind: 'out', label: 'フライ', dist: rnd(12, 34), hmax: rnd(26, 40) });
  const angF = ang >= 25 && ang <= 40 ? 1 : ang < 25 ? .55 + .45 * (ang - 8) / 17 : Math.max(.3, 1 - (ang - 40) / 30 * .6);
  const dist = MAXD * q * angF;
  if (dist >= fence(dir)) return Object.assign(base, { kind: 'hr', label: 'ホームラン！', dist, show: true });
  if (dist >= 85) return Object.assign(base, { kind: 'xbh', label: dist >= 100 ? 'スリーベース！' : 'ツーベース！', dist, show: true });
  if (dist >= 38) {
    if (ang <= 26 || R() < .22) return Object.assign(base, { kind: 'hit', label: 'ヒット！', dist, show: true });
    return Object.assign(base, { kind: 'out', label: 'フライ', dist });

  if (ang <= 22 && R() < .45) return Object.assign(base, { kind: 'hit', label: 'ポテンヒット！', dist: Math.max(dist, 30) });
  return Object.assign(base, { kind: 'out', label: ang <= 18 ? 'ライナー' : 'フライ', dist: Math.max(dist, 18) });

function startPitchCycle(delay) { state = 'ready'; phaseT = now() + delay; P = null; swing = null; fl = null; caught = false; label = null; }

  const t = now(), ts = t - relT, tc = ts + LAG, e = tc - P.T;
  const fp = ballAt(P, 1), bx = CX + fp.X * F / fp.Z, by = CY + fp.Y * F / fp.Z;

function startFlight(res) {

function flightPos(f, u) {

  label = { txt, pts, sub: `${P.name}　${P.kmh}km/h${res.show || res.kind === 'hr' ? `　飛距離 ${Math.round(res.dist)}m` : ''}`, kind: res.kind, t0: now() };
  if (res.kind === 'hr') { se('cheer'); flash = 1; for (let i = 0; i < 70; i++) particles.push({ x: rnd(0, W), y: rnd(-60, 0), vx: rnd(-30, 30), vy: rnd(60, 160), r: rnd(0, 6), c: ['#FFD43B', '#FF6B6B', '#4DABF7', '#69DB7C', '#fff'][i % 5], t: now() }); }

// ===== 毎フレーム =====
let lastT = now();
function step() {
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  // キーボード
  if (keys.size) { const v = 230 * dt; if (keys.has('ArrowLeft')) moveCur(-v, 0); if (keys.has('ArrowRight')) moveCur(v, 0); if (keys.has('ArrowUp')) moveCur(0, -v); if (keys.has('ArrowDown')) moveCur(0, v); }
  if (state === 'ready' && t >= phaseT) {
    if (results.length >= PITCHES) { state = 'end'; phaseT = t + .6; }
    else { P = makePitch(); state = 'windup'; phaseT = t + .8; }
  } else if (state === 'windup' && t >= phaseT) { state = 'pitch'; relT = t; se('pitch'); }
  else if (state === 'pitch') {
    const u = (t - relT) / P.T;
    if (swing && !swing.applied && t >= swing.tcAbs) {
      swing.applied = true;
      if (swing.res.kind !== 'miss') { startFlight(swing.res); state = 'hit'; }
    }
    if (state === 'pitch') {
      if (u >= 1 && !caught) { caught = true; se('mitt'); }
      const closeAt = relT + Math.max(P.T + TW - LAG + .02, P.T + .08);
      if (t >= closeAt && (!swing || swing.applied)) finish(swing ? swing.res : { kind: 'take' });
    }
  } else if (state === 'hit') {
    const u = (t - fl.t0) / fl.dur;
    if (u >= 1) finish(fl);
  } else if (state === 'after' && t >= phaseT) startPitchCycle(rnd(.35, .9));
  else if (state === 'end' && t >= phaseT) { state = 'over'; showResult(); }
  draw(t);
  requestAnimationFrame(step);
}

function batPose(t) {
  const st = { ang: A0 + Math.sin(t * 2.2) * .04, len: 1, hx: HAND0.x, hy: HAND0.y, swing: 0 };
  if (!swing) return st;
  const s = t - swing.t0, ease = v => v * v * (3 - 2 * v);

  if (s < LAG + .16) { const v = ease((s - LAG) / .16); return { ang: swing.ang + (Af - swing.ang) * v, len: 1 - .45 * v, hx: HAND1.x - 6 * v, hy: HAND1.y - 10 * v, swing: s }; }
  if (s < .75) return { ang: Af, len: .55, hx: HAND1.x - 6, hy: HAND1.y - 10, swing: s };
  if (s < 1.05) { const v = ease((s - .75) / .3); return { ang: Af + (A0 - Af) * v, len: .55 + .45 * v, hx: HAND1.x - 6 + (HAND0.x - HAND1.x + 6) * v, hy: HAND1.y - 10 + (HAND0.y - HAND1.y + 10) * v, swing: 0 }; }
  return st;
}

function drawBall(x, y, r) {

  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = 'rgba(80,70,60,.6)'; g.lineWidth = Math.max(.6, r * .1); g.stroke();
  if (r > 5) { g.strokeStyle = '#D9443A'; g.lineWidth = r * .12; g.beginPath(); g.arc(x - r * 1.2, y, r * .85, -.7, .7); g.stroke(); g.beginPath(); g.arc(x + r * 1.2, y, r * .85, Math.PI - .7, Math.PI + .7); g.stroke(); }
}

  const mound = fieldPt(0, 18.44);
  drawDog(g, dogKey, mound[0], mound[1] + 1, .64 + Math.sin(t * 3) * .003, dp);
  // ゾーン

  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 1;

  g.beginPath(); g.roundRect(52, 9, 300, 50, 12); g.fill(); g.stroke();

const swingBtn = document.getElementById('swingBtn'), padHint = document.getElementById('padHint');
let hintTimer = 0;

function moveCur(dx, dy) {
  cur.x = clamp(cur.x + dx, ZL - CRW * .5, ZR + CRW * .5);
  cur.y = clamp(cur.y + dy, ZT - CRH * .5, ZB + CRH * .5);
}
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  if (state === 'title' || state === 'over') return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; e.preventDefault();
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = W / stage.clientWidth * 1.15;
  moveCur((e.clientX - drag.x) * k, (e.clientY - drag.y) * k);
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.abs(cur.x - CX) > 8 || Math.abs(cur.y - (ZT + ZB) / 2) > 8) hideHint();

stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

['pointerup', 'pointercancel', 'pointerleave'].forEach(n => swingBtn.addEventListener(n, () => swingBtn.classList.remove('on')));
swingBtn.addEventListener('click', e => e.preventDefault());
const keys = new Set();
window.addEventListener('keydown', e => {

document.addEventListener('contextmenu', e => e.preventDefault());

}

document.getElementById('pickBtn').addEventListener('click', () => { se('tap'); showTitle(); });
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// 試しやすいように（開発用）：コンソールから window.__bb で中をのぞける
window.__bb = { get state() { return state; }, get P() { return P; }, get score() { return score; }, get results() { return results; }, cur, judge, doSwing, get CRW() { return CRW; }, get TW() { return TW; }, get MAXD() { return MAXD; }, get relT() { return relT; }, ballAt, setCat(o) { Object.assign(CAT, o); calcStats(); } };

window.addEventListener('resize', resize);
resize(); showTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { makeBg(); });
requestAnimationFrame(step);
</script>

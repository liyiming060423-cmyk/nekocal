<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>にゃんカロ</title>
<meta name="description" content="ごはんを撮って、歩いて、筋トレして育てる猫の育成ゲーム">
<meta name="theme-color" content="#FDE9C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にゃんカロ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="petcat.css">
</head>
<body>
<div id="app">

  <!-- ===== ホーム ===== -->
  <section id="tab-home" class="tab" aria-label="ホーム">
    <header class="home-top">
      <button id="btnUser" class="icon-btn" aria-label="ユーザー"></button>
      <div class="day-badge"><span id="dayWeek"></span><b id="dayNum">1</b><small>日目</small></div>
      <div class="top-right">
        <button id="btnLogin" class="icon-btn" aria-label="ログボ・プレゼント"><span class="dot" id="dotLogin" hidden></span></button>
        <button id="btnMission" class="icon-btn" aria-label="ミッション"><span class="dot" id="dotMission" hidden></span></button>
      </div>
    </header>
    <button class="kcal-card" id="kcalCard" aria-label="今日のカロリー">
      <span class="kcal-nums">今日 <b id="kcalIntake">0</b> / 目標 <b id="kcalTarget">0</b> kcal</span>
      <span class="kcal-bar"><i id="kcalBar"></i><em id="kcalMark"></em></span>
    </button>

    <div class="stage">
      <div class="stamina" role="meter" aria-label="スタミナ" aria-valuemin="0" aria-valuemax="100" id="stamMeter">
        <div class="stam-tube"><div class="stam-fill" id="stamFill"></div></div>
        <span class="stam-label">スタミナ</span>
        <b class="stam-val" id="stamVal">0%</b>
      </div>
      <div class="cat-wrap" id="catWrap"></div>
      <div class="bubble" id="bubble"></div>
      <div class="home-pills">
        <button class="pill" id="pillCoins" aria-label="肉球コイン"></button>
        <button class="pill" id="pillSteps" aria-label="今日の歩数"></button>
        <span class="pill" id="pillLevel"></span>
      </div>
      <button class="btn revive" id="btnRevive" hidden>新しい猫を迎える</button>
    </div>

    <div class="home-bottom">
      <button id="btnMini" class="mini-btn">ミニゲーム</button>
      <div class="body-pill" id="bodyPill"></div>
      <button id="btnCamera" class="camera-btn" aria-label="ごはんを撮る"></button>
    </div>
  </section>

  <!-- ===== ショップ ===== -->
  <section id="tab-shop" class="tab" aria-label="ショップ" hidden>
    <div class="page-head"><h1>ショップ</h1><div class="balance" id="shopBalance"></div></div>
    <div class="seg" role="tablist" id="shopSeg">
      <button role="tab" data-v="shop">ショップ</button>
      <button role="tab" data-v="gacha">ガチャ</button>
    </div>
    <div id="shopBody"></div>
  </section>

  <!-- ===== トレーニング＆ミニゲーム ===== -->
  <section id="tab-train" class="tab" aria-label="トレーニング" hidden>
    <div class="page-head"><h1>トレーニング</h1><div class="balance" id="trainBalance"></div></div>
    <div class="seg" role="tablist" id="trainSeg">
      <button role="tab" data-v="gym">ジム</button>
      <button role="tab" data-v="mini">ミニゲーム</button>
      <button role="tab" data-v="locker">更衣室</button>
    </div>
    <div id="trainBody"></div>
  </section>

  <!-- ===== りれき ===== -->
  <section id="tab-history" class="tab" aria-label="りれき" hidden>
    <div class="page-head"><span class="date-note" id="histDate"></span><h1>記録</h1></div>
    <div id="histBody"></div>
  </section>

  <!-- ===== せってい ===== -->
  <section id="tab-settings" class="tab" aria-label="せってい" hidden>
    <div class="page-head"><h1>せってい</h1></div>
    <div id="setBody"></div>
  </section>
</div>

<nav class="tabbar" aria-label="メニュー">
  <button data-tab="shop"><span class="ti" id="tiShop"></span><span>ショップ</span></button>
  <button data-tab="train"><span class="ti" id="tiTrain"></span><span>トレーニング</span></button>
  <button data-tab="home" class="home-tab"><span class="ti" id="tiHome"></span><span>ホーム</span></button>
  <button data-tab="history"><span class="ti" id="tiHistory"></span><span>りれき</span></button>
  <button data-tab="settings"><span class="ti" id="tiSettings"></span><span>せってい</span></button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close" id="modalClose" aria-label="閉じる">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script src="data.js"></script>
<script src="cat.js"></script>
<script src="petcat.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>

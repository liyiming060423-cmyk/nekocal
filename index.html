<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>にゃんカロ</title>
<meta name="description" content="ごはんを撮って、歩いて、筋トレして育てる猫の育成ゲーム">
<meta name="theme-color" content="#FDE9C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にゃんカロ">
<link rel="preload" href="zmg-900.woff2?v=10.5" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css?v=10.5">
<!-- ?v= はアプリの版。更新したら全部の ?v= と sw.js の VERSION、data.js の APP_VER を同じ数字に上げる（古いキャッシュと混ざらないように） -->
<link rel="stylesheet" href="style.css?v=10.5">
<link rel="stylesheet" href="petcat.css?v=10.5">
<link rel="stylesheet" href="battle.css?v=10.5">
<link rel="stylesheet" href="walk.css?v=10.5">
</head>
<body>
<!-- ===== タイトル画面（毎回はじめに出る） ===== -->
<div id="title" class="title" role="button" tabindex="0" aria-label="タップしてスタート">
  <button type="button" class="t-music" id="titleMusic" aria-label="音楽を鳴らす">🔈</button>
  <div class="t-logo"><span>にゃん</span><span>カロ</span></div>
  <p class="t-sub">ごはん・おさんぽ・筋トレで猫をそだてよう</p>
  <div class="t-cats" id="titleCats"></div>
  <p class="t-hello" id="titleHello"></p>
  <div class="t-start">タップしてスタート</div>
  <p class="t-foot">宮崎情報ビジネス専門学校</p>
</div>
<div id="app">

  <!-- ===== ホーム ===== -->
  <section id="tab-home" class="tab" aria-label="ホーム">
    <header class="h-top">
      <button class="coin-chip" id="pillCoins" aria-label="肉球コイン（ショップへ）"></button>
      <button class="name-chip" id="btnUser" aria-label="プロフィールを編集"></button>
      <button id="btnSettings" class="icon-btn" aria-label="せってい"></button>
    </header>
    <div class="h-row2">
      <button class="kcal-card" id="kcalCard" aria-label="今日のカロリー">
        <span class="kcal-ico" id="kcalIco"></span>
        <span class="kcal-main">
          <span class="kcal-nums">今日 <b id="kcalIntake">0</b> / 目標 <b id="kcalTarget">0</b> kcal</span>
          <span class="kcal-row"><span class="day-chip" id="dayChip"></span><span class="kcal-bar"><i id="kcalBar"></i><em id="kcalMark"></em></span></span>
        </span>
      </button>
      <button class="event-banner" id="eventBanner"></button>
    </div>

    <div class="h-stage">
      <div class="bubble" id="bubble"></div>
      <div class="cat-wrap" id="catWrap"></div>
      <!-- v10.5：ログボとミッションは 右上（上の列は コイン・名前・せってい だけにして、名前が切れないように） -->
      <div class="h-quick">
        <button id="btnLogin" class="icon-btn" aria-label="ログボ・プレゼント"><span class="dot" id="dotLogin" hidden></span></button>
        <button id="btnMission" class="icon-btn" aria-label="ミッション"><span class="dot" id="dotMission" hidden></span></button>
      </div>
      <div class="h-left">
        <div class="meter-card" role="meter" aria-label="スタミナ" aria-valuemin="0" aria-valuemax="100" id="stamMeter">
          <span class="mc-head"><span class="mc-ico" id="stamIco"></span>スタミナ</span><b class="mc-val" id="stamVal">0%</b>
          <span class="mc-bar"><i id="stamFill"></i></span>
        </div>
        <div class="meter-card" role="meter" aria-label="ごきげん" aria-valuemin="0" aria-valuemax="100" id="moodMeter">
          <span class="mc-head"><span class="mc-ico" id="moodIco"></span>ごきげん</span><b class="mc-val" id="moodVal">0%</b>
          <span class="mc-bar"><i id="moodFill"></i></span>
        </div>
      </div>
      <div class="h-right">
        <button class="gacha-btn" id="btnGacha" aria-label="ガチャへ"><span class="dot" id="dotGacha" hidden></span></button>
        <button id="btnCamera" class="camera-btn" aria-label="ごはんを撮る"></button>
      </div>
    </div>

    <div class="h-bottom">
      <button class="steps-card" id="pillSteps" aria-label="今日の歩数"></button>
      <button class="state-btn" id="bodyPill" aria-label="猫のステータス"></button>
    </div>
  </section>

  <!-- ===== ショップ ===== -->
  <section id="tab-shop" class="tab" aria-label="ショップ" hidden>
    <div class="page-head"><h1>ショップ</h1><div class="balance" id="shopBalance"></div></div>
    <div class="seg" role="tablist" id="shopSeg">
      <button role="tab" data-v="shop">ショップ</button>
      <button role="tab" data-v="gacha">ガチャ</button>
    </div>
    <div id="shopBody"></div>
  </section>

  <!-- ===== あそぶ（ジム・ミニゲーム。v10.1：更衣室は「ねこ」へ） ===== -->
  <section id="tab-train" class="tab" aria-label="あそぶ" hidden>
    <div class="page-head"><h1>あそぶ</h1><div class="balance" id="trainBalance"></div></div>
    <div class="seg" role="tablist" id="trainSeg">
      <button role="tab" data-v="gym">ジム</button>
      <button role="tab" data-v="mini">ミニゲーム</button>
    </div>
    <div id="trainBody"></div>
  </section>

  <!-- ===== きろく（1週間のきろく。v10.1：ステータスは「ねこ」へ） ===== -->
  <section id="tab-history" class="tab" aria-label="きろく" hidden>
    <div class="page-head"><span class="date-note" id="histDate"></span><h1>きろく</h1></div>
    <div id="histBody"></div>
  </section>

  <!-- ===== ねこ（v10.1：ステータス・きせかえ） ===== -->
  <section id="tab-cat" class="tab" aria-label="ねこ" hidden>
    <div class="page-head"><h1>ねこ</h1></div>
    <div class="seg" role="tablist" id="catSeg">
      <button role="tab" data-v="status">ステータス</button>
      <button role="tab" data-v="wear">きせかえ</button>
      <button role="tab" data-v="memo">おもいで<span class="dot seg-dot" id="dotMemo" hidden></span></button>
    </div>
    <div id="catBody"></div>
  </section>

  <!-- ===== せってい（v10.1：ホームの右上の ⚙ からひらく） ===== -->
  <section id="tab-settings" class="tab" aria-label="せってい" hidden>
    <div class="page-head"><button type="button" class="back-btn" id="setBack">‹ ホームへ</button><h1>せってい</h1></div>
    <div id="setBody"></div>
  </section>
</div>

<nav class="tabbar" aria-label="メニュー">
  <button data-tab="shop"><span class="ti" id="tiShop"></span><span>ショップ</span></button>
  <button data-tab="train"><span class="ti" id="tiTrain"></span><span>あそぶ</span></button>
  <button data-tab="home" class="home-tab"><span class="ti" id="tiHome"></span><span>ホーム</span></button>
  <button data-tab="history"><span class="ti" id="tiHistory"></span><span>きろく</span></button>
  <button data-tab="cat"><span class="ti" id="tiCat"></span><span>ねこ</span><span class="dot tab-dot" id="dotCat" hidden></span></button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close" id="modalClose" aria-label="閉じる">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script src="data.js?v=10.5"></script>
<script src="cat.js?v=10.5"></script>
<!-- v10.4：cat-ev.js（イベントのきせかえの絵） -->
<script src="cat-ev.js?v=10.5"></script>
<script src="petcat.js?v=10.5"></script>
<script src="battle.js?v=10.5"></script>
<script src="walk.js?v=10.5"></script>
<!-- v10.0：app.js を役割ごとに分けた。上から順番に読みこむ（順番を変えない。main.js は いちばん最後）。v10.1：fx.js（ごほうびの演出）・neko.js（ねこタブ）を追加 -->
<script src="storage.js?v=10.5"></script>
<script src="util.js?v=10.5"></script>
<script src="state.js?v=10.5"></script>
<script src="rules.js?v=10.5"></script>
<script src="sound.js?v=10.5"></script>
<script src="fx.js?v=10.5"></script>
<!-- v10.3：achieve.js（おもいで・ずっとミッション・ダイヤ・称号） -->
<script src="achieve.js?v=10.5"></script>
<script src="ui.js?v=10.5"></script>
<script src="daily.js?v=10.5"></script>
<script src="home.js?v=10.5"></script>
<script src="shop.js?v=10.5"></script>
<script src="train.js?v=10.5"></script>
<!-- v10.4：event.js（イベント：背景・イベントページ・イベントガチャ・ミニゲームの入り口） -->
<script src="event.js?v=10.5"></script>
<script src="history.js?v=10.5"></script>
<script src="neko.js?v=10.5"></script>
<script src="settings.js?v=10.5"></script>
<script src="main.js?v=10.5"></script>
<script>
// service worker の登録（v9.8：新しい版が来たら app.js の swWaiting でお知らせ → タップで入れかえ）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) swWaiting(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) swWaiting(w); });
      });
      setInterval(() => reg.update().catch(() => {}), 3600000);   // 開いたままでも1時間ごとに新しい版をさがす
    }).catch(() => {});
    // 入れかえが終わったら読みなおす（こちらから頼んだときだけ。はじめて開いたときは読みなおさない）
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (window.__swSkip && !window.__swReloaded) { window.__swReloaded = true; location.reload(); } });
  });
}
</script>
</body>
</html>

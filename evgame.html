<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>イベントのミニゲーム</title>
<!-- v10.4：イベントのミニゲーム（6つ）。にゃんカロの中から iframe で開く（event.js の openEvGame）。?e=イベントのid -->
<link rel="stylesheet" href="fonts.css?v=10.4.1">
<link rel="stylesheet" href="petcat.css?v=10.4.1">
<link rel="stylesheet" href="evgame.css?v=10.4.1">
</head>
<body>
<div id="eg" class="eg">
  <canvas id="egCanvas" aria-hidden="true"></canvas>
  <div id="egSprites" class="eg-sprites" aria-hidden="true"></div>
  <!-- 遊んでいるあいだの表示 -->
  <div id="egHud" class="eg-hud" hidden>
    <button type="button" class="eg-round" id="egPause" aria-label="いちじていし">Ⅱ</button>
    <div class="eg-score"><small>スコア</small><b id="egScore">0</b></div>
    <div class="eg-info" id="egInfo"></div>
    <div class="eg-timebar" id="egTimebar"><i id="egTime"></i></div>
  </div>
  <div id="egCombo" class="eg-combo" aria-hidden="true"></div>
  <div id="egCount" class="eg-count" aria-live="polite"></div>
  <!-- はじめ・いちじていし・けっか -->
  <div id="egPanel" class="eg-panel"></div>
  <div id="egLive" class="eg-sr" aria-live="polite"></div>
</div>
<script src="data.js?v=10.4.1"></script>
<script src="cat.js?v=10.4.1"></script>
<script src="cat-ev.js?v=10.4.1"></script>
<script src="petcat.js?v=10.4.1"></script>
<script src="evgame.js?v=10.4.1"></script>
<script src="evg-school.js?v=10.4.1"></script>
<script src="evg-rainy.js?v=10.4.1"></script>
<script src="evg-summer.js?v=10.4.1"></script>
<script src="evg-halloween.js?v=10.4.1"></script>
<script src="evg-xmas.js?v=10.4.1"></script>
<script src="evg-newyear.js?v=10.4.1"></script>
<script>EG.boot();</script>
</body>
</html>
